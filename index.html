<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Table</title>
    <style>
        /* Modern, elegant styling with a clean color palette */
        :root {
            --text-main: #2d3748;
            --text-muted: #718096;
            --bg-smooth: #f7fafc;
            --card-bg: #ffffff;
            --accent: #4a5568;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-smooth);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .wrapper {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: 500;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 30px; /* Smooth rounded search bar */
            outline: none;
            transition: all 0.2s ease-in-out;
            text-align: center;
            background-color: #fafafa;
        }

        .input-field:focus {
            border-color: #cbd5e0;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.05);
        }

        .results-list {
            margin-top: 15px;
            max-height: 280px;
            overflow-y: auto;
            border-radius: 8px;
        }

        .guest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid #f0f4f8;
            animation: fadeIn 0.3s ease-in-out;
        }

        .guest-item:last-child {
            border-bottom: none;
        }

        .name-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
        }

        .table-number {
            font-size: 14px;
            font-weight: 600;
            background-color: #edf2f7;
            padding: 6px 14px;
            border-radius: 20px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .status-message {
            color: var(--text-muted);
            padding: 30px 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Welcome to <br> Charbel & Paz Amor's<br> Wedding</h1>
    <p class="subtitle">Please enter your name below<br>to find your table assignment.</p>
    
    <div class="search-container">
        <input 
            type="text" 
            id="nameSearch" 
            class="input-field" 
            placeholder="Type your first or last name..." 
            autocomplete="off" 
            autofocus
        >
    </div>
    
    <div id="displayArea" class="results-list"></div>
</div>

<script>
    // Exact case-sensitive match directly from your Google deployment window
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbxWCdrx3bnp5vlGvviYsDX7sn49aYUUZMw93k4fgrQak5pvf3sBMyhYukwqjXIpOYoy/exec";

    const searchInput = document.getElementById('nameSearch');
    const displayArea = document.getElementById('displayArea');
    let timeoutDebounce = null;

    searchInput.addEventListener('input', (event) => {
        const searchTerm = event.target.value.trim();
        displayArea.innerHTML = '';

        // Keeps UI clean until they type at least 2 letters
        if (searchTerm.length < 2) {
            return;
        }

        // Debounce network requests to wait until the guest pauses typing (300ms)
        clearTimeout(timeoutDebounce);
        timeoutDebounce = setTimeout(() => {
            fetchSeatingData(searchTerm);
        }, 300); 
    });

    async function fetchSeatingData(query) {
        try {
            displayArea.innerHTML = '<div class="status-message">Searching guest list...</div>';
            
            // Securely call your private Google Apps Script endpoint with redirect handling
            const response = await fetch(`${GOOGLE_API_URL}?search=${encodeURIComponent(query)}`, {
                method: 'GET',
                mode: 'cors',
                redirect: 'follow'
            });
            const result = await response.json();

            displayArea.innerHTML = '';

            // If Google returns an error or zero matches
            if (!result.success || result.data.length === 0) {
                displayArea.innerHTML = `
                    <div class="status-message">
                        No results found.<br>
                        <span style="font-size: 12px; color: #a0aec0;">Try checking the spelling or typing your last name.</span>
                    </div>`;
                return;
            }

            // Securely loop through and render only the matching names returned by Google
            result.data.forEach(guest => {
                const item = document.createElement('div');
                item.className = 'guest-item';
                item.innerHTML = `
                    <span class="name-text">${guest.name}</span>
                    <span class="table-number">Table ${guest.table}</span>
                `;
                displayArea.appendChild(item);
            });

        } catch (err) {
            console.error("Secure fetch failure:", err);
            displayArea.innerHTML = '<div class="status-message">Connection issue. Please see our coordinator.</div>';
        }
    }
</script>

</body>
</html>
