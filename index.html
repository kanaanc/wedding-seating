<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Table</title>
    <style>
        :root {
            --text-main: #4a3f47;
            --text-muted: #7a6a78;
            --bg-smooth: #fdf5f2;
            --card-bg: #ffffff;
            --accent: #b86b7a;
            --accent-soft: #f6d7db;
            --border-soft: rgba(184, 107, 122, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Georgia", "Times New Roman", serif;
            background: radial-gradient(circle at top left, rgba(251, 221, 225, 0.45), transparent 32%),
                        radial-gradient(circle at bottom right, rgba(216, 181, 192, 0.28), transparent 28%),
                        linear-gradient(180deg, #fff9f6 0%, #f9ede9 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px;
        }

        .wrapper {
            background: var(--card-bg);
            padding: 42px 34px;
            border-radius: 28px;
            box-shadow: 0 18px 45px rgba(94, 55, 77, 0.12);
            width: 100%;
            max-width: 520px;
            text-align: center;
            border: 1px solid var(--border-soft);
            position: relative;
            overflow: hidden;
        }

        .wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 110%;
            height: 140px;
            background: radial-gradient(circle, rgba(255, 244, 238, 0.35), transparent 60%);
            pointer-events: none;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            line-height: 1.1;
        }

        .divider {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 18px auto 24px;
            color: var(--accent);
            font-size: 18px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: "";
            display: inline-block;
            width: 46px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 34px;
            line-height: 1.7;
        }

        .search-container {
            position: relative;
            margin-bottom: 22px;
        }

        .input-field {
            width: 100%;
            padding: 18px 22px;
            font-size: 16px;
            border: 1px solid rgba(184, 107, 122, 0.24);
            border-radius: 999px;
            outline: none;
            transition: all 0.25s ease;
            text-align: center;
            background-color: #fff6f3;
            color: var(--text-main);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .input-field::placeholder {
            color: #a88b98;
            opacity: 1;
        }

        .input-field:focus {
            border-color: var(--accent);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(184, 107, 122, 0.12);
        }

        .results-list {
            margin-top: 16px;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 20px;
        }

        .guest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f7e5e7;
            animation: fadeIn 0.3s ease-in-out;
            background: linear-gradient(180deg, rgba(255, 250, 248, 0.95), #fffaf8);
        }

        .guest-item:last-child {
            border-bottom: none;
        }

        .name-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .table-number {
            font-size: 14px;
            font-weight: 700;
            background-color: var(--accent-soft);
            padding: 8px 16px;
            border-radius: 24px;
            color: var(--accent);
            letter-spacing: 0.05em;
        }

        .status-message {
            color: var(--text-muted);
            padding: 28px 12px;
            font-size: 15px;
            line-height: 1.7;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Welcome to <br> Charbel & Paz Amor's<br> Wedding</h1>
    <div class="divider">Love & Celebration</div>
    <p class="subtitle">Please enter your name below<br>to find your table assignment.</p>
    
    <div class="search-container">
        <input 
            type="text" 
            id="nameSearch" 
            class="input-field" 
            placeholder="Type your name..." 
            autocomplete="off" 
            autofocus
        >
    </div>
    
    <div id="displayArea" class="results-list"></div>
</div>

<script>
const CLOUDFLARE_API_URL = "https://wedding-seating.charbel-kanaan86.workers.dev/api/search";

    const searchInput = document.getElementById('nameSearch');
    const displayArea = document.getElementById('displayArea');
    let timeoutDebounce = null;

    searchInput.addEventListener('input', (event) => {
        const searchTerm = event.target.value.trim();
        clearTimeout(timeoutDebounce);

        // Keeps UI completely clean until they type at least 2 letters
        if (searchTerm.length < 2) {
            displayArea.innerHTML = '';
            return;
        }

        // Debounce requests to 250ms so it doesn't spam the network on every single keystroke
        timeoutDebounce = setTimeout(() => {
            fetchSeatingData(searchTerm);
        }, 250); 
    });

    async function fetchSeatingData(query) {
        try {
            // Fetch the prefix array from your newly updated worker
            const response = await fetch(`${CLOUDFLARE_API_URL}?name=${encodeURIComponent(query)}`);
            
            if (!response.ok) throw new Error("API Network issue");
            
            const result = await response.json();
            displayArea.innerHTML = '';

            // Handle no matches found
            if (!result.success || !result.data || result.data.length === 0) {
                displayArea.innerHTML = `
                    <div class="status-message">
                        No results found.<br>
                        <span style="font-size: 12px; color: #a0aec0;">Check your spelling or type your last name instead.</span>
                    </div>`;
                return;
            }

            // Loop through the list of matches and append them to the UI dynamically
            result.data.forEach(guest => {
                const item = document.createElement('div');
                item.className = 'guest-item';
                item.innerHTML = `
                    <span class="name-text">${guest.Name}</span>
                    <span class="table-number">Table ${guest.TableNbr}</span>
                `;
                displayArea.appendChild(item);
            });

        } catch (err) {
            console.error("Fetch failure:", err);
        }
    }
</script>

</body>
</html>
